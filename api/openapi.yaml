openapi: 3.1.1
info:
  title: Cable API
  version: 0.0.1
  description: Public operator and player HTTP contract for Cable.
servers:
  - url: https://localhost:8443/api/v1
tags:
  - name: system
  - name: operator
  - name: player
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /operator/me:
    get:
      tags: [operator]
      operationId: getOperatorMe
      security: [{operatorToken: []}]
      x-required-scopes: []
      responses:
        "200":
          description: Authenticated operator identity, scopes, and capabilities.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperatorMe"}
        default: {$ref: "#/components/responses/Problem"}
  /enrollment-tokens:
    post:
      tags: [operator]
      operationId: createEnrollmentToken
      security: [{operatorToken: []}]
      x-required-scopes: [node_enroll]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: One-time enrollment secret. The secret is never retrievable again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTokenCreated"
        default:
          $ref: "#/components/responses/Problem"
  /admin-tokens:
    get:
      tags: [operator]
      operationId: listAdminTokens
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      responses:
        "200":
          description: Token metadata; never token secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AdminToken"}
  /admin-tokens/{tokenId}/revoke:
    post:
      tags: [operator]
      operationId: revokeAdminToken
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      parameters:
        - $ref: "#/components/parameters/TokenId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Token revoked or already revoked.}
        default: {$ref: "#/components/responses/Problem"}
  /nodes:
    get:
      tags: [operator]
      operationId: listNodes
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Nodes in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodePage"}
  /nodes/{nodeId}:
    get:
      tags: [operator]
      operationId: getNode
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: updateNode
      security: [{operatorToken: []}]
      x-required-scopes: [node_write]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        "200":
          description: Updated node.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [operator]
      operationId: unregisterNode
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Node credentials revoked and node removed from the active Fleet view.}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/status:
    get:
      tags: [operator]
      operationId: getNodeStatus
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Latest observed node status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeReport"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/capabilities:
    get:
      tags: [operator]
      operationId: getNodeCapabilities
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Latest player capability report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CapabilityReport"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/recovery-tokens:
    post:
      tags: [operator]
      operationId: createNodeRecoveryToken
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: One-time recovery secret bound to the existing node ID.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrollmentTokenCreated"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/assignment:
    get:
      tags: [operator]
      operationId: getNodeAssignment
      security: [{operatorToken: []}]
      x-required-scopes: [assignment_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Desired assignment.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Assignment"}
        default: {$ref: "#/components/responses/Problem"}
    put:
      tags: [operator]
      operationId: putNodeAssignment
      security: [{operatorToken: []}]
      x-required-scopes: [assignment_write]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssignmentInput"}
      responses:
        "200":
          description: Existing idempotent assignment response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Assignment"}
        "201":
          description: New assignment generation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Assignment"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/events:
    get:
      tags: [operator]
      operationId: listNodeEvents
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - name: cursor
          in: query
          description: Last consumed event sequence; this is not a keyset cursor.
          schema: {type: string, pattern: "^[0-9]+$"}
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Node events. nextCursor is the last returned sequence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventPage"}
  /uploads:
    get:
      tags: [operator]
      operationId: listUploads
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Uploads in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadPage"}
    post:
      tags: [operator]
      operationId: createUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UploadCreate"}
      responses:
        "201":
          description: Upload created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Problem"}
  /uploads/{uploadId}:
    head:
      tags: [operator]
      operationId: headUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters: [{$ref: "#/components/parameters/UploadId"}]
      responses:
        "204":
          description: Current offset and declared length.
          headers:
            Upload-Offset: {schema: {type: integer, format: int64, minimum: 0}}
            Upload-Length: {schema: {type: integer, format: int64, minimum: 1}}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: appendUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: Upload-Offset
          in: header
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: {type: string, format: binary}
      responses:
        "204":
          description: Chunk accepted.
          headers:
            Upload-Offset: {schema: {type: integer, format: int64, minimum: 0}}
        default: {$ref: "#/components/responses/Problem"}
  /uploads/{uploadId}/complete:
    post:
      tags: [operator]
      operationId: completeUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Asset and immutable artifact created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        default: {$ref: "#/components/responses/Problem"}
  /assets/register-local:
    post:
      tags: [operator]
      operationId: registerLocalAsset
      security: [{operatorToken: []}]
      x-required-scopes: [local_media_read]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties: {path: {type: string, minLength: 1}}
      responses:
        "201":
          description: Asset copied into Cable storage.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        default: {$ref: "#/components/responses/Problem"}
  /assets:
    get:
      tags: [operator]
      operationId: listAssets
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Assets in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetPage"}
  /assets/{assetId}:
    get:
      tags: [operator]
      operationId: getAsset
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters: [{$ref: "#/components/parameters/AssetId"}]
      responses:
        "200":
          description: Asset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        default: {$ref: "#/components/responses/Problem"}
  /assignments:
    get:
      tags: [operator]
      operationId: listAssignments
      security: [{operatorToken: []}]
      x-required-scopes: [assignment_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Assignments in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssignmentPage"}
  /releases:
    get:
      tags: [operator]
      operationId: listReleases
      security: [{operatorToken: []}]
      x-required-scopes: [release_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Releases in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleasePage"}
  /releases/publish:
    post:
      tags: [operator]
      operationId: publishRelease
      security: [{operatorToken: []}]
      x-required-scopes: [release_write]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PublishReleaseInput"}
      responses:
        "201":
          description: Immutable signed release.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleaseEnvelope"}
        default: {$ref: "#/components/responses/Problem"}
  /releases/{releaseId}:
    get:
      tags: [operator]
      operationId: getRelease
      security: [{operatorToken: []}]
      x-required-scopes: [release_read]
      parameters: [{$ref: "#/components/parameters/ReleaseId"}]
      responses:
        "200":
          description: Release envelope.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReleaseEnvelope"}
        default: {$ref: "#/components/responses/Problem"}
  /cable/deployments:
    get:
      tags: [operator]
      operationId: listCableDeployments
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Cable deployments in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableDeploymentPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [operator]
      operationId: createCableDeployment
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CableDeploymentInput"}
      responses:
        "201":
          description: Cable deployment created.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableDeployment"}
        default: {$ref: "#/components/responses/Problem"}
  /cable/deployments/{deploymentId}:
    parameters: [{$ref: "#/components/parameters/CableDeploymentId"}]
    get:
      tags: [operator]
      operationId: getCableDeployment
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      responses:
        "200":
          description: Cable deployment.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableDeployment"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: updateCableDeployment
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CableDeploymentInput"}
      responses:
        "200":
          description: Cable deployment updated.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableDeployment"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [operator]
      operationId: deleteCableDeployment
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "204": {description: Cable deployment deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /cable/deployments/{deploymentId}/channels:
    parameters: [{$ref: "#/components/parameters/CableDeploymentId"}]
    get:
      tags: [operator]
      operationId: listCableChannels
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Channels belonging to the deployment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableChannelPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [operator]
      operationId: createCableChannel
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CableChannelInput"}
      responses:
        "201":
          description: Cable channel created.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableChannel"}
        default: {$ref: "#/components/responses/Problem"}
  /cable/channels/{channelId}:
    parameters: [{$ref: "#/components/parameters/CableChannelId"}]
    get:
      tags: [operator]
      operationId: getCableChannel
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      responses:
        "200":
          description: Cable channel.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableChannel"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: updateCableChannel
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CableChannelInput"}
      responses:
        "200":
          description: Cable channel updated.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableChannel"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [operator]
      operationId: deleteCableChannel
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "204": {description: Cable channel deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /cable/channels/{channelId}/programs:
    parameters: [{$ref: "#/components/parameters/CableChannelId"}]
    get:
      tags: [operator]
      operationId: listCablePrograms
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Program entries belonging to the channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableProgramPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [operator]
      operationId: createCableProgram
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CableProgramInput"}
      responses:
        "201":
          description: Cable program entry created.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableProgram"}
        default: {$ref: "#/components/responses/Problem"}
  /cable/programs/{programId}:
    parameters: [{$ref: "#/components/parameters/CableProgramId"}]
    get:
      tags: [operator]
      operationId: getCableProgram
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      responses:
        "200":
          description: Cable program entry.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableProgram"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: updateCableProgram
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CableProgramInput"}
      responses:
        "200":
          description: Cable program entry updated.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableProgram"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [operator]
      operationId: deleteCableProgram
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IfMatch"}]
      responses:
        "204": {description: Cable program entry deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /cable/playlists:
    get:
      tags: [operator]
      operationId: listCablePlaylists
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Reusable Cable media playlists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CablePlaylistPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [operator]
      operationId: createCablePlaylist
      security: [{operatorToken: []}]
      x-required-scopes: [cable_write]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CablePlaylistInput"}
      responses:
        "201":
          description: Cable playlist created.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CablePlaylist"}
        default: {$ref: "#/components/responses/Problem"}
  /cable/playlists/{playlistId}:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Id"}
    get:
      tags: [operator]
      operationId: getCablePlaylist
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      responses:
        "200":
          description: Cable playlist.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CablePlaylist"}
        default: {$ref: "#/components/responses/Problem"}
  /cable/channels/{channelId}/blocks:
    parameters: [{$ref: "#/components/parameters/CableChannelId"}]
    get:
      tags: [operator]
      operationId: listCableBlocks
      security: [{operatorToken: []}]
      x-required-scopes: [cable_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Scheduled playlist blocks for the channel.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CableBlockPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
