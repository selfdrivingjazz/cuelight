openapi: 3.1.1
info:
  title: Cuelight API
  version: 0.0.1
  description: Public operator and player HTTP contract for Cuelight.
servers:
  - url: https://localhost:8443/api/v1
tags:
  - name: system
  - name: operator
  - name: player
  - name: profiles
    description: Saved sets of per-screen assignments that are activated at once.
  - name: browser-node
    description: >-
      Browser nodes pair with a claim code and authenticate with a bearer credential
      (browserNodeToken) instead of mTLS. Every /player/* operation (except enroll,
      recover, credential rotation, and screenshots) is also served at
      /browser-node/player/* with browserNodeToken; artifact content additionally
      accepts the token as the access_token query parameter for media elements.
  - name: playlists
    description: Ordered lists of file and web media with per-item durations, assignable to nodes as media-schedule releases.
  - name: software
    description: >-
      Vendor-signed Cuelight software releases. Control imports a release envelope
      (cuelight-release.json) from the update feed (CUELIGHT_CONTROL_UPDATE_FEED_URL, polled every
      CUELIGHT_CONTROL_UPDATE_CHECK_INTERVAL unless CUELIGHT_CONTROL_UPDATE_CHECK=off), from
      `cuelight-control updates import DIR`, or from an operator upload, and verifies it against
      the vendor keys compiled into control; artifacts are mirrored into control CAS only when
      their sha256 and size match the signed manifest. Operators choose a target version per
      node; nodes receive it as Assignment.software and verify the envelope themselves. Every
      response carries `X-Cuelight-Version: <control version>`; browser nodes reload when it
      differs from the build they run.
  - name: app
    description: >-
      Web media with appAccess enabled ("Cuelight app") are presented with an app token so the
      page can read the media library and playlists and consume the screen's remote input.
      When a node presents a web release whose presentation carries appAccess true, it mints a
      token for web.mediaId (POST /player/app-tokens, or /browser-node/player/app-tokens for
      browser nodes) and opens the page URL with fragment parameters
      `cuelight-token=<token>&cuelight-api=<apiUrl>`, both values encoded with
      encodeURIComponent. Any existing fragment is kept: existing cuelight-token and
      cuelight-api parameters are dropped from it and ours are appended joined with `&`
      (https://app.example/x#view=grid becomes
      https://app.example/x#view=grid&cuelight-token=T&cuelight-api=https%3A%2F%2Fcontrol.example%2Fapi%2Fv1;
      a URL without a fragment gets #cuelight-token=T&cuelight-api=...). If minting fails the
      node fails the presentation instead of showing the page without a token. Tokens last 24h,
      are valid only while the node's current assignment targets that media item, and stop
      working when the node is reassigned, revoked, or unregistered; POST /app/token:renew
      returns a successor. Pages authenticate /app/* with `Authorization: Bearer <token>`
      (media content and thumbnails also accept the access_token query parameter). /app/*
      responses carry `Access-Control-Allow-Origin: *`, allow OPTIONS preflight, use no
      cookies, and are read-only except token renewal. Nodes do not inject native remote input
      into app pages and do not show their own remote QR overlay for them; the page polls
      /app/remote/events and renders the phone-remote QR itself from the remote field.
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.yaml:
    get:
      tags: [system]
      operationId: getOpenApiSpec
      description: "This OpenAPI document. Served with Access-Control-Allow-Origin: *."
      security: []
      responses:
        "200":
          description: The embedded API contract.
          content:
            application/yaml:
              schema: {type: string}
  /operator/me:
    get:
      tags: [operator]
      operationId: getOperatorMe
      security: [{operatorToken: []}]
      x-required-scopes: []
      responses:
        "200":
          description: Authenticated operator identity, scopes, and capabilities.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperatorMe"}
        default: {$ref: "#/components/responses/Problem"}
  /enrollment-tokens:
    post:
      tags: [operator]
      operationId: createEnrollmentToken
      security: [{operatorToken: []}]
      x-required-scopes: [node_enroll]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: One-time enrollment secret. The secret is never retrievable again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentTokenCreated"
        default:
          $ref: "#/components/responses/Problem"
  /admin-tokens:
    get:
      tags: [operator]
      operationId: listAdminTokens
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      responses:
        "200":
          description: Token metadata; never token secrets.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AdminToken"}
  /admin-tokens/{tokenId}/revoke:
    post:
      tags: [operator]
      operationId: revokeAdminToken
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      parameters:
        - $ref: "#/components/parameters/TokenId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Token revoked or already revoked.}
        default: {$ref: "#/components/responses/Problem"}
  /nodes:
    get:
      tags: [operator]
      operationId: listNodes
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Nodes in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodePage"}
  /nodes/{nodeId}:
    get:
      tags: [operator]
      operationId: getNode
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Node.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: updateNode
      security: [{operatorToken: []}]
      x-required-scopes: [node_write]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        "200":
          description: Updated node.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [operator]
      operationId: unregisterNode
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: Node credentials revoked and node removed from the active Fleet view.}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/status:
    get:
      tags: [operator]
      operationId: getNodeStatus
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Latest observed node status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeReport"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/capabilities:
    get:
      tags: [operator]
      operationId: getNodeCapabilities
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Latest player capability report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CapabilityReport"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/recovery-tokens:
    post:
      tags: [operator]
      operationId: createNodeRecoveryToken
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: One-time recovery secret bound to the existing node ID.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrollmentTokenCreated"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/remote-link:
    post:
      tags: [operator]
      operationId: createNodeRemoteLink
      summary: Mint a phone link for the node's remote-input session, opening one for its current assignment if it has none (as after a control restart).
      security: [{operatorToken: []}]
      x-required-scopes: [assignment_write]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "201":
          description: Phone link bound to the active session; valid until the session expires.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemoteLink"}
        "404":
          description: The node has no active remote-input session and its current assignment does not allow remote input.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: Remote input is disabled for the node's assignment.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/assignment:
    get:
      tags: [operator]
      operationId: getNodeAssignment
      security: [{operatorToken: []}]
      x-required-scopes: [assignment_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: Desired assignment.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Assignment"}
        default: {$ref: "#/components/responses/Problem"}
    put:
      tags: [operator]
      operationId: putNodeAssignment
      security: [{operatorToken: []}]
      x-required-scopes: [assignment_write]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssignmentInput"}
      responses:
        "200":
          description: Existing idempotent assignment response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Assignment"}
        "201":
          description: New assignment generation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Assignment"}
        default: {$ref: "#/components/responses/Problem"}
  /nodes/{nodeId}/events:
    get:
      tags: [operator]
      operationId: listNodeEvents
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - name: cursor
          in: query
          description: Last consumed event sequence; this is not a keyset cursor.
          schema: {type: string, pattern: "^[0-9]+$"}
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Node events. nextCursor is the last returned sequence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventPage"}
  /uploads:
    get:
      tags: [operator]
      operationId: listUploads
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Uploads in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadPage"}
    post:
      tags: [operator]
      operationId: createUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UploadCreate"}
      responses:
        "201":
          description: Upload created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Problem"}
  /uploads/{uploadId}:
    head:
      tags: [operator]
      operationId: headUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters: [{$ref: "#/components/parameters/UploadId"}]
      responses:
        "204":
          description: Current offset and declared length.
          headers:
            Upload-Offset: {schema: {type: integer, format: int64, minimum: 0}}
            Upload-Length: {schema: {type: integer, format: int64, minimum: 1}}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: appendUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - name: Upload-Offset
          in: header
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: {type: string, format: binary}
      responses:
        "204":
          description: Chunk accepted.
          headers:
            Upload-Offset: {schema: {type: integer, format: int64, minimum: 0}}
        default: {$ref: "#/components/responses/Problem"}
  /uploads/{uploadId}/complete:
    post:
      tags: [operator]
      operationId: completeUpload
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters:
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Asset and immutable artifact created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        default: {$ref: "#/components/responses/Problem"}
  /assets/register-local:
    post:
      tags: [operator]
      operationId: registerLocalAsset
      security: [{operatorToken: []}]
      x-required-scopes: [local_media_read]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties: {path: {type: string, minLength: 1}}
      responses:
        "201":
          description: Asset copied into Cuelight storage.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        default: {$ref: "#/components/responses/Problem"}
  /assets:
    get:
      tags: [operator]
      operationId: listAssets
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSort"
        - $ref: "#/components/parameters/PageOrder"
        - $ref: "#/components/parameters/PageSearch"
      responses:
        "200":
          description: Assets in deterministic keyset order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetPage"}
  /assets/{assetId}:
    get:
      tags: [operator]
      operationId: getAsset
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters: [{$ref: "#/components/parameters/AssetId"}]
      responses:
        "200":
          description: Asset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        default: {$ref: "#/components/responses/Problem"}
  /media:
    get:
      tags: [operator]
      operationId: listMedia
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageSearch"
        - name: sort
          in: query
          description: Sort key. Defaults to createdAt.
          schema: {type: string, enum: [createdAt, title, size, type], default: createdAt}
        - $ref: "#/components/parameters/PageOrder"
        - name: playable
          in: query
          schema: {type: boolean, default: true}
        - name: assetId
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: {$ref: "#/components/schemas/Id"}
        - name: kind
          in: query
          description: File media (uploaded assets) or web media (pages).
          schema: {type: string, enum: [file, web]}
        - name: mediaType
          in: query
          description: Narrows to file media whose artifact is an image, video, or audio type.
          schema: {type: string, enum: [image, video, audio]}
      responses:
        "200":
          description: Library media. With playable=true, web media are always included.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaPage"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [operator]
      operationId: createMedia
      description: "Creates file media from an asset, or web media from a URL (kind web). Web media start a background viewport capture; adding a URL that is already in the library returns that item with 200. The Idempotency-Key header is required for file media."
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: {type: string, minLength: 16, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaInput"}
      responses:
        "200":
          description: The web URL was already in the library.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Media"}
        "201":
          description: Media created.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Media"}
        default: {$ref: "#/components/responses/Problem"}
  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Id"}
    get:
      tags: [operator]
      operationId: getMedia
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      responses:
        "200":
          description: Authored media.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Media"}
        default: {$ref: "#/components/responses/Problem"}
    patch:
      tags: [operator]
      operationId: updateMedia
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MediaPatch"}
      responses:
        "200":
          description: Authored media updated. Web media accept title, description, tags, and appAccess; appAccess on file media is rejected (400).
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Media"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [operator]
      operationId: deleteMedia
      description: Removes an operator-added web page. File media cannot be deleted (409); web media used by a playlist return 409.
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Problem"}
  /media/{mediaId}/refresh:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Id"}
    post:
      tags: [operator]
      operationId: refreshMedia
      description: Recaptures a web media viewport now (1920x1080). 409 for file media; 503 when the controller has no headless browser.
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      responses:
        "200":
          description: Media after the capture attempt; thumbnailError is set when it failed.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Media"}
        default: {$ref: "#/components/responses/Problem"}
  /media/{mediaId}/usage:
    get:
      tags: [operator]
      operationId: getMediaUsage
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Id"}
      responses:
        "200":
          description: Direct authored-media usage summary.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaUsage"}
        default: {$ref: "#/components/responses/Problem"}
  /media/{mediaId}/content:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Id"}
    head:
      tags: [operator]
      operationId: headMediaContent
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      responses:
        "200":
          description: Authored-media preview metadata.
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Content-Length: {schema: {type: integer, format: int64, minimum: 0}}
            ETag: {$ref: "#/components/headers/ETag"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [operator]
      operationId: getMediaContent
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - name: Range
          in: header
          schema: {type: string}
        - name: If-Range
          in: header
          schema: {type: string}
      responses:
        "200":
          description: Complete authored-media preview bytes.
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          description: Partial authored-media preview bytes.
          headers:
            Content-Range: {schema: {type: string}}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Problem"}
  /media/{mediaId}/thumbnail:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Id"}
    get:
      tags: [operator]
      operationId: getMediaThumbnail
      description: Persisted poster (file media, JPEG) or viewport capture (web media, PNG or JPEG). Pass `v={thumbnail.digest}` so the immutable response can be cached for a year.
      security: [{operatorToken: []}]
      x-required-scopes: [media_read]
      parameters:
        - name: v
          in: query
          schema: {type: string, pattern: "^[a-f0-9]{64}$"}
      responses:
        "200":
          description: Thumbnail bytes.
          headers:
            ETag: {$ref: "#/components/headers/ETag"}
            Cache-Control: {schema: {type: string}}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        "304": {description: Not modified.}
        default: {$ref: "#/components/responses/Problem"}
    put:
      tags: [operator]
      operationId: putMediaThumbnail
      description: Stores an operator-captured poster frame for media whose format the controller cannot decode (for example video). The image is re-encoded and downscaled server-side.
      security: [{operatorToken: []}]
      x-required-scopes: [media_write]
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Media with its persisted thumbnail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Media"}
        default: {$ref: "#/components/responses/Problem"}
  /usage/{kind}/{id}:
    get:
      tags: [operator]
      operationId: getResourceUsage
      security: [{operatorToken: []}]
