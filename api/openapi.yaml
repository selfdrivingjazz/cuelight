              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        "304": {description: Not modified.}
        default: {$ref: "#/components/responses/Problem"}
  /app/playlists:
    get:
      tags: [app]
      operationId: listAppPlaylists
      security: [{appToken: []}]
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Playlists, as GET /playlists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlaylistPage"}
        "401": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /app/playlists/{playlistId}:
    parameters: [{$ref: "#/components/parameters/PlaylistId"}]
    get:
      tags: [app]
      operationId: getAppPlaylist
      security: [{appToken: []}]
      responses:
        "200":
          description: Playlist.
          headers: {ETag: {$ref: "#/components/headers/ETag"}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Playlist"}
        "401": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /app/remote/events:
    get:
      tags: [app]
      operationId: pollAppRemoteEvents
      security: [{appToken: []}]
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: waitSeconds
          in: query
          schema: {type: integer, minimum: 0, maximum: 25, default: 0}
      responses:
        "200":
          description: Remote events of the node's active phone-remote session newer than after; long-polls up to waitSeconds.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppRemoteEventPage"}
        "401": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /app/token:renew:
    post:
      tags: [app]
      operationId: renewAppToken
      security: [{appToken: []}]
      responses:
        "200":
          description: Successor app token; refused with 401 once the node is no longer assigned the media item.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppToken"}
        "401": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /browser-nodes:
    get:
      tags: [operator]
      operationId: listBrowserNodes
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      responses:
        "200":
          description: Unrevoked browser nodes with credential and presence details.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BrowserNode"}}
        default: {$ref: "#/components/responses/Problem"}
  /browser-nodes/claims:
    post:
      tags: [operator]
      operationId: claimBrowserNode
      description: Redeems the code shown on a browser node's pairing screen and creates a node of class browser.
      security: [{operatorToken: []}]
      x-required-scopes: [node_enroll]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: {type: string, description: "Claim code; case, spaces, and dashes are ignored.", minLength: 8, maxLength: 32}
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        "201":
          description: Browser node created; the browser collects its credential on its next poll.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserNode"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /browser-nodes/{nodeId}/revoke:
    post:
      tags: [operator]
      operationId: revokeBrowserNode
      security: [{operatorToken: []}]
      x-required-scopes: [security_admin]
      parameters:
        - $ref: "#/components/parameters/NodeId"
      responses:
        "204": {description: Browser node and all its credentials revoked.}
        "404": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /browser-node/claims:
    post:
      tags: [browser-node]
      operationId: startBrowserNodeClaim
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userAgent: {type: string, maxLength: 300}
      responses:
        "201":
          description: Pending claim; display code/QR and poll with pollToken.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserNodeClaim"}
        default: {$ref: "#/components/responses/Problem"}
  /browser-node/claims/{claimId}:
    get:
      tags: [browser-node]
      operationId: pollBrowserNodeClaim
      description: Authorization is `Bearer <pollToken>`. The credential is returned exactly once; later polls return 410.
      security: [{browserClaimToken: []}]
      parameters:
        - {name: claimId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
      responses:
        "200":
          description: Claim status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserNodeClaimStatus"}
        "401": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /browser-node/credentials:renew:
    post:
      tags: [browser-node]
      operationId: renewBrowserNodeCredential
      security: [{browserNodeToken: []}]
      responses:
        "200":
          description: Replacement credential; the presented token stops working.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserCredential"}
        "401": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /browser-node/player/app-tokens:
    post:
      tags: [browser-node, app]
      operationId: createBrowserNodeAppToken
      description: Browser-node equivalent of POST /player/app-tokens.
      security: [{browserNodeToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AppTokenRequest"}
      responses:
        "201":
          description: App token for the node and media item.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppToken"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        default: {$ref: "#/components/responses/Problem"}
  /software:
    get:
      tags: [operator, software]
      operationId: getSoftwareOverview
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      responses:
        "200":
          description: Control's version, the newest imported release, and feed status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SoftwareOverview"}
        default: {$ref: "#/components/responses/Problem"}
  /software/releases:
    get:
      tags: [operator, software]
      operationId: listSoftwareReleases
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      responses:
        "200":
          description: Imported releases, newest version first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SoftwareRelease"}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      tags: [operator, software]
      operationId: importSoftwareRelease
      description: >-
        Streams a release into control. The first multipart part must be the signed envelope
        (form field `envelope` or a file named cuelight-release.json); every later file part is an
        artifact identified by its file name. Artifacts are hashed while they are written, so
        uploads of any size up to CUELIGHT_CONTROL_MAX_UPLOAD_BYTES are not buffered. Re-uploading
        a release is idempotent and fills in artifacts that were missing. Files the manifest does
        not list are ignored and reported. An untrusted signature is 422; artifact bytes that do
        not match the manifest are 422 (other artifacts still import).
      security: [{operatorToken: []}]
      x-required-scopes: [node_write]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope: {type: string, format: binary}
                artifacts: {type: array, items: {type: string, format: binary}}
      responses:
        "200":
          description: The release was already imported; artifact outcomes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SoftwareImportResult"}
        "201":
          description: Release imported.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SoftwareImportResult"}
        default: {$ref: "#/components/responses/Problem"}
  /software/releases/{version}:
    get:
      tags: [operator, software]
      operationId: getSoftwareRelease
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/SoftwareVersion"}]
      responses:
        "200":
          description: One imported release.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SoftwareRelease"}
        default: {$ref: "#/components/responses/Problem"}
  /software/check:
    post:
      tags: [operator, software]
      operationId: checkSoftwareFeed
      description: Checks the update feed now and mirrors a new release. Feed failures are reported in lastError, not as an HTTP error.
      security: [{operatorToken: []}]
      x-required-scopes: [node_write]
      responses:
        "200":
          description: Feed status after the check.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SoftwareFeedStatus"}
        default: {$ref: "#/components/responses/Problem"}
  /software/nodes:
    get:
      tags: [operator, software]
      operationId: listNodeSoftware
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      responses:
        "200":
          description: Software status of every unrevoked node.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/NodeSoftwareStatus"}}
        default: {$ref: "#/components/responses/Problem"}
  /software/nodes/{nodeId}:
    get:
      tags: [operator, software]
      operationId: getNodeSoftware
      security: [{operatorToken: []}]
      x-required-scopes: [node_read]
      parameters: [{$ref: "#/components/parameters/NodeId"}]
      responses:
        "200":
          description: One node's software status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeSoftwareStatus"}
        default: {$ref: "#/components/responses/Problem"}
  /software/nodes/{nodeId}/target:
    parameters: [{$ref: "#/components/parameters/NodeId"}]
    put:
      tags: [operator, software]
      operationId: setNodeSoftwareTarget
      description: >-
        Asks the node to run an imported version. 409 when the version is below the node's running
        version; 400 when the node has not reported a version, follows control (browser), does not
        update (none), or the release has no artifact for its update method and platform.
      security: [{operatorToken: []}]
      x-required-scopes: [node_write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {type: string}
      responses:
        "200":
          description: Updated software status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeSoftwareStatus"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      tags: [operator, software]
      operationId: clearNodeSoftwareTarget
      description: Cancels a pending update; the node stays on what it runs.
      security: [{operatorToken: []}]
      x-required-scopes: [node_write]
      responses:
        "200":
          description: Updated software status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodeSoftwareStatus"}
        default: {$ref: "#/components/responses/Problem"}
  /software/rollouts:
    post:
      tags: [operator, software]
      operationId: rolloutSoftware
      description: >-
        Targets a version on the listed nodes, or (allEligible) on every node that can install it
        and runs an older version. Nodes that cannot take it are skipped with a reason.
      security: [{operatorToken: []}]
      x-required-scopes: [node_write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {type: string}
                nodeIds: {type: array, items: {$ref: "#/components/schemas/Id"}}
                allEligible: {type: boolean}
      responses:
        "200":
          description: Targeted and skipped nodes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SoftwareRolloutResult"}
        default: {$ref: "#/components/responses/Problem"}
  /player/software/releases/{version}:
    get:
      tags: [player, software]
      operationId: getPlayerSoftwareRelease
      security: [{nodeMTLS: []}]
      parameters: [{$ref: "#/components/parameters/SoftwareVersion"}]
      responses:
        "200":
          description: The signed release envelope exactly as imported; verify it before use.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SoftwareReleaseEnvelope"}
        default: {$ref: "#/components/responses/Problem"}
  /player/software/artifacts/{sha256}:
    parameters:
      - {name: sha256, in: path, required: true, schema: {type: string, pattern: "^[a-f0-9]{64}$"}}
    head:
      tags: [player, software]
      operationId: headPlayerSoftwareArtifact
      security: [{nodeMTLS: []}]
      responses:
        "200":
          description: Artifact metadata.
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Content-Length: {schema: {type: integer, format: int64, minimum: 0}}
            ETag: {$ref: "#/components/headers/ETag"}
        default: {$ref: "#/components/responses/Problem"}
    get:
      tags: [player, software]
      operationId: getPlayerSoftwareArtifact
      description: Bytes of an artifact of any imported release, by sha256. Range and If-Range are supported.
      security: [{nodeMTLS: []}]
      parameters:
        - {name: Range, in: header, schema: {type: string}}
        - {name: If-Range, in: header, schema: {type: string}}
      responses:
        "200":
          description: Complete artifact.
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          description: One satisfiable byte range.
          headers:
            Content-Range: {schema: {type: string}}
            ETag: {$ref: "#/components/headers/ETag"}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "416": {description: Unsatisfiable byte range.}
        default: {$ref: "#/components/responses/Problem"}
  /updates/{version}/{name}:
    servers:
      - url: https://localhost:8443
    parameters:
      - $ref: "#/components/parameters/SoftwareVersion"
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      tags: [software]
      operationId: downloadSoftwareArtifact
      description: >-
        Unauthenticated mirror of the artifacts of imported, verified releases (electron-updater
        feeds, the Android shell's APK, and "Get the app" downloads). Range is supported.
      security: []
      responses:
        "200":
          description: Artifact bytes.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "206": {description: One satisfiable byte range.}
        default: {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: CuelightToken
      description: >-
        Operator bearer token. When control is configured with
        CUELIGHT_CONTROL_TRUSTED_NETWORKS, a request with no Authorization header
        whose TCP peer address (never X-Forwarded-For) is inside a trusted network
        authenticates as the built-in "Trusted network" actor with every operator
        scope. Such requests are refused with 403 when Sec-Fetch-Site is present and
        not same-origin/none, or when Origin is present and differs from control's
        public origin. A present Authorization header is always evaluated as a token
        and is never upgraded by network trust.
    nodeMTLS:
      type: mutualTLS
    browserNodeToken:
      type: http
      scheme: bearer
      bearerFormat: CuelightBrowserNodeToken
    appToken:
      type: http
      scheme: bearer
      bearerFormat: CuelightAppToken
    browserClaimToken:
      type: http
      scheme: bearer
      bearerFormat: CuelightBrowserClaimPollToken
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    NodeId: {name: nodeId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    TokenId: {name: tokenId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    UploadId: {name: uploadId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    AssetId: {name: assetId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    ReleaseId: {name: releaseId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    PlaylistId: {name: playlistId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    AppAccessToken:
      name: access_token
      in: query
      description: App token for media elements that cannot send an Authorization header.
      schema: {type: string}
    ProfileId: {name: profileId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    PageCursor:
      name: cursor
      in: query
      description: Opaque, server-issued keyset cursor.
      schema: {type: string, maxLength: 2048}
    PageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    PageSort:
      name: sort
      in: query
      schema: {type: string}
    PageOrder:
      name: order
      in: query
      schema: {type: string, enum: [asc, desc], default: asc}
    PageSearch:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    SoftwareVersion: {name: version, in: path, required: true, schema: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"}}
    Digest:
      name: digest
      in: path
      required: true
      schema: {type: string, pattern: "^[a-f0-9]{64}$"}
  headers:
    ETag: {schema: {type: string}}
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    ScreenshotExpected:
      type: object
      properties:
        expected: {type: boolean}
        releaseDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
        itemId: {type: string}
        effectiveAt: {type: string, format: date-time}
    ScreenshotCompletion:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [completed, failed, unsupported]}
        artifactDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
        mediaType: {type: string}
        errorReason: {type: string}
    ScreenshotJob:
      type: object
      required: [id, nodeId, expected, requestedAt, expiresAt, status, retentionPolicy, retentionUntil, artifactRetentionUntil]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        nodeId: {$ref: "#/components/schemas/Id"}
        expected: {$ref: "#/components/schemas/ScreenshotExpected"}
        requestedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        claimedAt: {type: string, format: date-time}
        completionAt: {type: string, format: date-time}
        status: {type: string, enum: [queued, claimed, completed, failed, unsupported, expired]}
        resultArtifactDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
        resultMediaType: {type: string}
        errorReason: {type: string}
        retentionPolicy: {type: string}
        retentionUntil: {type: string, format: date-time}
        artifactRetentionUntil: {type: string, format: date-time}
    Id: {type: string, format: uuid}
    ProfileScreen:
      type: object
      additionalProperties: false
      description: One node's saved assignment. Exactly one of mediaId and playlistId is set.
      required: [nodeId, remoteInput, showQr]
      properties:
        nodeId: {$ref: "#/components/schemas/Id"}
        mediaId: {$ref: "#/components/schemas/Id"}
        playlistId: {$ref: "#/components/schemas/Id"}
        deliveryMode: {type: string, enum: [stream, cache_then_play], description: Omitted uses the server default for the media.}
        remoteInput: {type: boolean}
        showQr: {type: boolean}
        settings: {type: object, additionalProperties: true, description: Reserved per-screen settings.}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [name, screens]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        screens: {type: array, items: {$ref: "#/components/schemas/ProfileScreen"}}
    Profile:
      type: object
      additionalProperties: false
      required: [id, name, description, version, screens, createdBy, updatedBy, createdAt, updatedAt, active]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        description: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        screens: {type: array, items: {$ref: "#/components/schemas/ProfileScreen"}}
        createdBy: {$ref: "#/components/schemas/Id"}
        updatedBy: {$ref: "#/components/schemas/Id"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastActivatedAt: {type: string, format: date-time}
        active: {type: boolean, description: Whether this is the most recently activated profile.}
    ProfileList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Profile"}}
    ProfileActivationResult:
      type: object
      additionalProperties: false
      required: [nodeId]
      properties:
        nodeId: {$ref: "#/components/schemas/Id"}
        assignmentId: {$ref: "#/components/schemas/Id"}
        error: {type: string}
    ProfileActivation:
      type: object
      additionalProperties: false
      required: [id, profileId, activatedAt, activatedBy, results]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        profileId: {$ref: "#/components/schemas/Id"}
        activatedAt: {type: string, format: date-time}
        activatedBy: {$ref: "#/components/schemas/Id"}
        results: {type: array, items: {$ref: "#/components/schemas/ProfileActivationResult"}}
    ProfileDrift:
      type: object
      additionalProperties: false
      required: [nodeId, reason]
      properties:
        nodeId: {$ref: "#/components/schemas/Id"}
        reason: {type: string, enum: [assignment_changed, unassigned, node_missing]}
    ActiveProfile:
      type: object
      additionalProperties: false
      required: [drifted, drift]
      properties:
        profileId: {$ref: "#/components/schemas/Id"}
        profileName: {type: string}
        activatedAt: {type: string, format: date-time}
        drifted: {type: boolean}
        drift: {type: array, items: {$ref: "#/components/schemas/ProfileDrift"}}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        correlationId: {type: string}
    OperatorMe:
      type: object
      required: [id, authMethod, scopes, capabilities]
      properties:
        id: {type: string}
        tokenId: {type: string, description: Present for token authentication.}
        authMethod:
          type: string
          enum: [token, network]
          description: token for a bearer token; network for a token-less request from a trusted network.
        peerAddress:
          type: string
          description: The trusted TCP peer address; present only when authMethod is network.
        scopes: {type: array, items: {type: string}}
        capabilities: {type: object, additionalProperties: {type: boolean}}
    PageInfo:
      type: object
      required: [nextCursor, previousCursor, hasMore]
      properties:
        nextCursor: {type: [string, "null"]}
        previousCursor: {type: [string, "null"]}
        hasMore: {type: boolean}
    PlaylistItemInput:
      type: object
      additionalProperties: false
      description: Exactly one of mediaId (any file or web media item) or assetId (file asset) is required.
      required: [position, durationSeconds]
      properties:
        mediaId: {$ref: "#/components/schemas/Id"}
        assetId: {$ref: "#/components/schemas/Id"}
        position: {type: integer, minimum: 1}
        durationSeconds: {type: integer, minimum: 1}
        title: {type: string}
        subtitle: {type: string}
    PlaylistInput:
      type: object
      additionalProperties: false
      required: [name, items]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/PlaylistItemInput"}
    PlaylistItem:
      type: object
      additionalProperties: false
      description: >-
        mediaId is set whenever the item's media row exists (file items resolve to their file
        media row); assetId is set only for file items. Clients re-submitting items send exactly
        one source: mediaId when present, otherwise assetId.
      required: [id, playlistId, position, durationSeconds, title, subtitle]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        playlistId: {$ref: "#/components/schemas/Id"}
        mediaId: {$ref: "#/components/schemas/Id"}
        assetId: {$ref: "#/components/schemas/Id"}
        position: {type: integer, minimum: 1}
        durationSeconds: {type: integer, minimum: 1}
        title: {type: string}
        subtitle: {type: string}
    Playlist:
      type: object
      additionalProperties: false
      required: [id, name, description, items, version, createdBy, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        description: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/PlaylistItem"}}
        version: {type: integer, format: int64, minimum: 1}
        createdBy: {$ref: "#/components/schemas/Id"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PlaylistPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Playlist"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    AppTokenRequest:
      type: object
      additionalProperties: false
      required: [mediaId]
      properties:
        mediaId: {description: Web media item with appAccess that the node's current assignment targets., $ref: "#/components/schemas/Id"}
    AppToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt, apiUrl]
      properties:
        token: {type: string, minLength: 1}
        expiresAt: {type: string, format: date-time}
        apiUrl: {type: string, format: uri, description: "Public API base of the control plane, e.g. https://control.example/api/v1."}
    AppContext:
      type: object
      additionalProperties: false
      required: [nodeId, nodeName, mediaId]
      properties:
        nodeId: {$ref: "#/components/schemas/Id"}
        nodeName: {type: string}
        mediaId: {$ref: "#/components/schemas/Id"}
    AppRemote:
      type: object
      additionalProperties: false
      description: The node's active phone-remote session; the page renders the QR for url when showQr is set.
      required: [url, showQr, expiresAt]
      properties:
        url: {type: string, format: uri}
        showQr: {type: boolean}
        expiresAt: {type: string, format: date-time}
    AppRemoteEventPage:
      type: object
      additionalProperties: false
      required: [events, nextSequence]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/RemoteEvent"}
        nextSequence: {type: integer, format: int64, minimum: 0}
        remote: {$ref: "#/components/schemas/AppRemote"}
    NodePage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Node"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    AssetPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Asset"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    EventPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/NodeEvent"}}
        nextCursor: {type: [string, "null"]}
        page: {$ref: "#/components/schemas/PageInfo"}
    UploadPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Upload"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    ReleasePage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ReleaseEnvelope"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    AssignmentPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Assignment"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    AdminToken:
      type: object
      required: [id, prefix, scopes, revoked]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        prefix: {type: string}
        scopes: {type: array, items: {type: string}}
        revoked: {type: boolean}
    EnrollmentTokenCreated:
      type: object
      required: [id, secret, expiresAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        secret: {type: string, writeOnly: true}
        expiresAt: {type: string, format: date-time}
        joinUrl:
          type: string
          description: >-
            Desktop join link `cuelight://join?v=1&url=…&token=…[&ca=sha256:…]&name=…`.
            Present for enrollment tokens when CUELIGHT_CONTROL_PUBLIC_URL is configured.
        caSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 (hex) of the self-signed root DER anchoring control's TLS chain; omitted for publicly trusted chains.
    RemoteLink:
      type: object
      required: [sessionId, remoteUrl, expiresAt]
      properties:
        sessionId: {type: string}
        remoteUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    Node:
      type: object
      required: [id, name, credentialState]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        credentialState: {type: string, enum: [active, revoked, expired]}
        nodeClass: {type: string, enum: [native, browser]}
        desiredGeneration: {type: integer, format: int64, minimum: 0}
        observedGeneration: {type: integer, format: int64, minimum: 0}
    BrowserNode:
      type: object
      required: [id, name, nodeClass, credentialState, createdAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        nodeClass: {type: string, enum: [browser]}
        credentialState: {type: string, enum: [active, revoked, expired]}
        credentialExpiresAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        userAgent: {type: string}
        createdAt: {type: string, format: date-time}
    BrowserNodeClaim:
      type: object
      required: [claimId, code, displayCode, pollToken, expiresAt, pollIntervalSeconds]
      properties:
        claimId: {$ref: "#/components/schemas/Id"}
        code: {type: string, pattern: "^[A-Z0-9]{8}$"}
        displayCode: {type: string, description: "Code formatted for display, e.g. K7QM-4XPD."}
        pollToken: {type: string}
        expiresAt: {type: string, format: date-time}
        pollIntervalSeconds: {type: integer, minimum: 1}
        pairUrl: {type: string, format: uri, description: "Operator console pair page with the code prefilled (QR target)."}
    BrowserCredential:
      type: object
      required: [nodeId, token, expiresAt, renewAfter, eventEpoch]
      properties:
        nodeId: {$ref: "#/components/schemas/Id"}
        token: {type: string}
        expiresAt: {type: string, format: date-time}
        renewAfter: {type: string, format: date-time}
        eventEpoch: {type: string, description: "Report/event epoch for player reports."}
    BrowserNodeClaimStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [pending, claimed]}
        expiresAt: {type: string, format: date-time}
        credential: {$ref: "#/components/schemas/BrowserCredential"}
    UploadCreate:
      type: object
      required: [name, length, mediaType]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        length: {type: integer, format: int64, minimum: 1}
        mediaType: {type: string}
    Upload:
      type: object
      additionalProperties: false
      required: [id, name, length, offset, mediaType, state]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string, minLength: 1, maxLength: 255}
        length: {type: integer, format: int64, minimum: 1}
        offset: {type: integer, format: int64, minimum: 0}
        mediaType: {type: string}
        state: {type: string, enum: [open, finalizing, complete, failed]}
        artifactDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
    Artifact:
      type: object
      required: [digest, size, mediaType]
      properties:
        digest: {type: string, pattern: "^[a-f0-9]{64}$"}
        size: {type: integer, format: int64, minimum: 1}
        mediaType: {type: string}
        state: {type: string, enum: [ready, quarantined, missing]}
    Asset:
      type: object
      required: [id, name, artifact]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        artifact: {$ref: "#/components/schemas/Artifact"}
    MediaPlayback:
      type: object
      additionalProperties: false
      required: [fit, loop, muted, volume, orientation]
      properties:
        fit: {type: string, enum: [fit, fill]}
        loop: {type: boolean}
        muted: {type: boolean}
        volume: {type: integer, minimum: 0, maximum: 100}
        orientation: {type: integer, enum: [0, 90, 180, 270]}
    MediaInput:
      type: object
      additionalProperties: false
      description: "File media: assetId, title, tags, playback. Web media: kind web, url, optional title (defaults to the URL)."
      properties:
        kind: {type: string, enum: [file, web], default: file}
        assetId: {$ref: "#/components/schemas/Id"}
        url: {type: string, format: uri, description: Absolute http or https URL without userinfo (web media).}
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 4096}
        artist: {type: string, maxLength: 255}
        tags: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        artworkAssetId: {$ref: "#/components/schemas/Id"}
        playback: {$ref: "#/components/schemas/MediaPlayback"}
        appAccess: {type: boolean, default: false, description: "Web media only: present the page as a Cuelight app with an app token (see the app tag)."}
    MediaPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 4096}
        artist: {type: string, maxLength: 255}
        tags: {type: array, maxItems: 64, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        artworkAssetId: {$ref: "#/components/schemas/Id"}
        playback: {$ref: "#/components/schemas/MediaPlayback"}
        appAccess: {type: boolean, description: Web media only; 400 for file media.}
    Media:
      type: object
      additionalProperties: false
      required: [id, kind, title, tags, appAccess, version, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        kind: {type: string, enum: [file, web]}
        assetId: {description: File media only., $ref: "#/components/schemas/Id"}
        url: {type: string, format: uri, description: "Web media: the page URL."}
        appAccess: {type: boolean, description: "Web media presented as a Cuelight app with access to the screen's remote and the media library. Always false for file media."}
        faviconUrl: {type: string, format: uri}
        thumbnailError: {type: string, description: Last web capture failure.}
        thumbnailAttemptedAt: {type: string, format: date-time}
        title: {type: string}
        description: {type: string}
        artist: {type: string}
        tags: {type: array, items: {type: string}}
        artworkAssetId: {$ref: "#/components/schemas/Id"}
        playback: {description: File media only., $ref: "#/components/schemas/MediaPlayback"}
        artifact: {description: File media only., $ref: "#/components/schemas/Artifact"}
        version: {type: integer, format: int64, minimum: 1}
        createdBy: {$ref: "#/components/schemas/Id"}
        updatedBy: {$ref: "#/components/schemas/Id"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        thumbnail: {$ref: "#/components/schemas/MediaThumbnail"}
    MediaThumbnail:
      type: object
      additionalProperties: false
      required: [digest, mediaType, width, height]
      properties:
        digest: {type: string, pattern: "^[a-f0-9]{64}$"}
        mediaType: {type: string, enum: [image/jpeg, image/png]}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        source: {type: string, enum: [server, node], description: "Web media: server is a headless capture on the controller; node is a screenshot from a screen showing the page."}
        capturedAt: {type: string, format: date-time}
    MediaUsage:
      type: object
      additionalProperties: false
      required: [mediaId, releaseCount, scheduleCount]
      properties:
        mediaId: {$ref: "#/components/schemas/Id"}
        releaseCount: {type: integer, format: int64, minimum: 0}
        scheduleCount: {type: integer, format: int64, minimum: 0}
    MediaPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Media"}}
        page: {$ref: "#/components/schemas/PageInfo"}
    UsageReference:
      type: object
      additionalProperties: false
      required: [kind, id, name, href]
      properties:
        kind: {type: string, enum: [media, playlist, release, assignment]}
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        href: {type: string, pattern: "^/"}
    UsagePage:
      type: object
      additionalProperties: false
      required: [resourceId, references, hasMore]
      properties:
        resourceId: {$ref: "#/components/schemas/Id"}
        references: {type: array, items: {$ref: "#/components/schemas/UsageReference"}}
        nextCursor: {type: string}
        hasMore: {type: boolean}
    PlaybackPayload:
      type: object
      required: [assetId, fit, loop, muted, volume, orientation, allowedDeliveryModes]
      properties:
        assetId: {$ref: "#/components/schemas/Id"}
        fit: {type: string, enum: [fit, fill]}
        loop: {type: boolean}
        muted: {type: boolean}
        volume: {type: integer, minimum: 0, maximum: 100}
        imageDurationSeconds: {type: integer, minimum: 1, maximum: 86400}
        orientation: {type: integer, enum: [0, 90, 180, 270]}
        allowedDeliveryModes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [stream, cache_then_play]}
    MediaPresentation:
      type: object
      required: [playback]
      properties:
        playback: {$ref: "#/components/schemas/PlaybackPayload"}
    MediaScheduleWindow:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    MediaScheduleItem:
      type: object
      additionalProperties: false
      description: A file item (artifactDigest, mediaType, playback fields) or a web item (web.url). Releases with web items require the web feature.
      required: [id, startsAt, endsAt]
      properties:
        id: {type: string, minLength: 1}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        web:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url: {type: string, format: uri}
        artifactDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
        mediaType: {type: string}
        fit: {type: string, enum: [fit, fill]}
        loop: {type: boolean}
        muted: {type: boolean}
        volume: {type: integer, minimum: 0, maximum: 100}
        imageDurationSeconds: {type: integer, minimum: 1, maximum: 86400}
        orientation: {type: integer, enum: [0, 90, 180, 270]}
    MediaSchedulePresentation:
      type: object
      additionalProperties: false
      required: [timezone, window, items, artifactClosure, allowedDeliveryModes]
      properties:
        timezone: {type: string, minLength: 1}
        window: {$ref: "#/components/schemas/MediaScheduleWindow"}
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/MediaScheduleItem"}
        artifactClosure:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: "^[a-f0-9]{64}$"}
        allowedDeliveryModes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [stream, cache_then_play]}
    WebPresentation:
      type: object
      required: [url]
      properties:
        url: {type: string, format: uri, description: Absolute http or https URL without userinfo.}
        appAccess: {type: boolean, description: "The page is a Cuelight app: the node mints an app token for mediaId and passes it in the URL fragment (see the app tag)."}
        mediaId: {description: Web media item the release presents; set when appAccess is true., $ref: "#/components/schemas/Id"}
    ReleasePresentation:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [media, media-schedule, web]}
        media: {$ref: "#/components/schemas/MediaPresentation"}
        mediaSchedule: {$ref: "#/components/schemas/MediaSchedulePresentation"}
        web: {$ref: "#/components/schemas/WebPresentation"}
      discriminator: {propertyName: kind}
      oneOf:
        - type: object
          required: [kind, media]
          properties:
            kind: {type: string, const: media}
            media: {$ref: "#/components/schemas/MediaPresentation"}
        - type: object
          required: [kind, mediaSchedule]
          properties:
            kind: {type: string, const: media-schedule}
            mediaSchedule: {$ref: "#/components/schemas/MediaSchedulePresentation"}
        - type: object
          required: [kind, web]
          properties:
            kind: {type: string, const: web}
            web: {$ref: "#/components/schemas/WebPresentation"}
    PublishReleaseInput:
      type: object
      required: [playback]
      properties:
        playback: {$ref: "#/components/schemas/PlaybackPayload"}
    ReleasePayload:
      type: object
      required: [schemaVersion, minimumProtocolVersion, artifacts, requiredFeatures]
      oneOf:
        - required: [presentation]
        - required: [playback]
      properties:
        schemaVersion: {type: string, enum: ["1.0", "1.1"]}
        minimumProtocolVersion: {type: string}
        presentation: {$ref: "#/components/schemas/ReleasePresentation"}
        playback: {$ref: "#/components/schemas/PlaybackPayload"}
        artifacts: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Artifact"}}
        requiredFeatures: {type: array, items: {type: string}, uniqueItems: true}
    ReleaseEnvelope:
      type: object
      required: [id, digest, keyId, signature, payload]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        digest: {type: string, pattern: "^[a-f0-9]{64}$"}
        keyId: {type: string}
        signature: {type: string, contentEncoding: base64}
        payload: {$ref: "#/components/schemas/ReleasePayload"}
    AssignmentInput:
      type: object
      additionalProperties: false
      description: Targets exactly one of mediaId or playlistId. The server publishes or reuses the signed release that presents it (file media → media, web media → web, playlists → media-schedule).
      required: [expectedGeneration]
      properties:
        mediaId: {$ref: "#/components/schemas/Id"}
        playlistId: {$ref: "#/components/schemas/Id"}
        deliveryMode: {type: string, enum: [stream, cache_then_play], description: "Defaults to cache_then_play when the release allows it, otherwise stream."}
        expectedGeneration: {type: integer, format: int64, minimum: 0}
        remoteInput:
          type: boolean
          description: >-
            Omitted keeps the node's current assignment value (false when it has none), so a
            screen's phone remote survives reassignment. false also turns off an inherited showQr.
        showQr:
          type: boolean
          description: >-
            Omitted keeps the node's current assignment value (false when it has none). Requires
            remoteInput to be true after inheritance.
    Assignment:
      description: >-
        A node with a software target but no content assignment receives an Assignment whose id,
        releaseId, releaseDigest, presentationKind, and deliveryMode are empty strings; only
        nodeId and software are meaningful and the node keeps presenting nothing.
      type: object
      required: [id, nodeId, releaseId, releaseDigest, deliveryMode, expectedGeneration, desiredGeneration, remoteInput, showQr]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        nodeId: {$ref: "#/components/schemas/Id"}
        mediaId: {$ref: "#/components/schemas/Id"}
        playlistId: {$ref: "#/components/schemas/Id"}
        releaseId: {description: Read-only audit of the release the server published or reused., $ref: "#/components/schemas/Id"}
        releaseDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
        deliveryMode: {type: string, enum: [stream, cache_then_play]}
        expectedGeneration: {type: integer, format: int64, minimum: 0}
        desiredGeneration: {type: integer, format: int64, minimum: 1}
        remoteInput: {type: boolean}
        showQr: {type: boolean}
        presentationKind: {type: string, enum: [media, media-schedule, web]}
        software: {$ref: "#/components/schemas/SoftwareTarget"}
    SoftwareTarget:
      type: object
      description: >-
        The version control wants the node to run; absent means stay put. Nodes never install a
        version at or below the one they run. URLs are absolute when CUELIGHT_CONTROL_PUBLIC_URL is
        set and origin-relative otherwise.
      required: [version, manifestUrl, artifactsBaseUrl]
      properties:
        version: {type: string}
        manifestUrl: {type: string, description: "GET (mTLS): the signed release envelope."}
        artifactsBaseUrl: {type: string, description: "Append an artifact's sha256 to download it (mTLS, Range)."}
        apkUrl: {type: string, description: "Browser nodes in the Android shell (updateMethod android): public APK URL."}
        apkSha256: {type: string, pattern: "^[a-f0-9]{64}$"}
    RemoteEvent:
      type: object
      additionalProperties: false
      required: [sequence, type]
      properties:
        sequence: {type: integer, format: int64, minimum: 1}
        type: {type: string, enum: [key, text, pointer, wheel]}
        key: {type: string, enum: [ArrowUp, ArrowDown, ArrowLeft, ArrowRight, Enter, Escape, Backspace, Tab, VolumeUp, VolumeDown, Mute, ChannelUp, ChannelDown, Guide, Info, Delete, Home, End, PageUp, PageDown, Space, BrowserBack, BrowserForward, BrowserReload]}
        text: {type: string, minLength: 1, maxLength: 4096}
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        deltaX: {type: number, minimum: -10, maximum: 10}
        deltaY: {type: number, minimum: -10, maximum: 10}
        button: {type: string, enum: [left, right, middle]}
        state: {type: string, enum: [move, down, up, click]}
    RemoteSession:
      type: object
      additionalProperties: false
      required: [sessionId, token, remoteUrl, showQr, expiresAt]
      properties:
        sessionId: {type: string}
        token: {type: string, writeOnly: true}
        remoteUrl: {type: string, format: uri}
        showQr: {type: boolean}
        expiresAt: {type: string, format: date-time}
    RemoteEventPage:
      type: object
      additionalProperties: false
      required: [events, nextSequence]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/RemoteEvent"}
        nextSequence: {type: integer, format: int64, minimum: 0}
    EnrollPlayerInput:
      type: object
      required: [token, publicKey]
      properties:
        token: {type: string, writeOnly: true}
        publicKey: {type: string, contentEncoding: base64}
        name: {type: string, minLength: 1, maxLength: 120}
    ClientCredential:
      type: object
      required: [certificate, expiresAt]
      properties:
        certificate: {type: string, writeOnly: true}
        expiresAt: {type: string, format: date-time}
    EnrollPlayerOutput:
      allOf:
        - $ref: "#/components/schemas/ClientCredential"
        - type: object
          required: [nodeId, eventEpoch, publisherKeyId, publisherPublicKey]
          properties:
            nodeId: {$ref: "#/components/schemas/Id"}
            eventEpoch: {type: string, format: uuid}
            publisherKeyId: {type: string}
            publisherPublicKey: {type: string, contentEncoding: base64}
    CapabilityReport:
      type: object
      required: [platform, architecture, protocolVersion, rendererVersion, profileId]
      properties:
        platform: {type: string}
        architecture: {type: string}
        protocolVersion: {type: string}
        rendererVersion: {type: string}
        profileId: {type: string}
        features: {type: array, items: {type: string}, uniqueItems: true}
        acceptedMediaTypes: {type: array, items: {type: string}, uniqueItems: true}
        freeBytes: {type: integer, format: int64, minimum: 0}
        outputReady: {type: boolean}
        clockReliable: {type: boolean}
        softwareVersion: {type: string, description: Semantic version of the software the node runs.}
        channel: {type: string, enum: [stable, beta]}
        updateMethod: {type: string, enum: [desktop, appliance, browser, android, none]}
        outputStandby: {type: boolean, description: "Connected, but the node's shared local display currently shows another Cuelight network."}
    SoftwareOverview:
      type: object
      required: [control, feed]
      properties:
        control:
          type: object
          required: [version, updateAvailable]
          properties:
            version: {type: string}
            latestAvailable: {type: string, description: Newest imported stable release.}
            updateAvailable: {type: boolean}
        feed: {$ref: "#/components/schemas/SoftwareFeedStatus"}
        latest: {$ref: "#/components/schemas/SoftwareRelease"}
    SoftwareFeedStatus:
      type: object
      required: [enabled, url, intervalSeconds]
      properties:
        enabled: {type: boolean}
        url: {type: string}
        intervalSeconds: {type: integer, format: int64}
        lastCheckedAt: {type: string, format: date-time}
        lastSuccessAt: {type: string, format: date-time}
        lastError: {type: string}
        lastVersion: {type: string}
    SoftwareArtifact:
      type: object
      required: [component, os, arch, format, name, size, sha256, available, downloadUrl]
      properties:
        component: {type: string, enum: [control, player, cli, minimal-node, desktop, android]}
        os: {type: string}
        arch: {type: string}
        format: {type: string}
        name: {type: string}
        size: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        available: {type: boolean, description: The bytes are mirrored in control.}
        downloadUrl: {type: string, description: "Origin-relative public mirror path, /updates/{version}/{name}."}
    SoftwareRelease:
      type: object
      required: [version, channel, publishedAt, importedAt, source, keyId, minimumProtocolVersion, artifacts]
      properties:
        version: {type: string}
        channel: {type: string, enum: [stable, beta]}
        publishedAt: {type: string, format: date-time}
        importedAt: {type: string, format: date-time}
        source: {type: string, enum: [feed, cli, upload]}
        keyId: {type: string}
        minimumProtocolVersion: {type: string}
        artifacts: {type: array, items: {$ref: "#/components/schemas/SoftwareArtifact"}}
    SoftwareReleaseEnvelope:
      type: object
      required: [manifest, keyId, signature]
      properties:
        manifest: {type: string, contentEncoding: base64, description: Exact signed manifest JSON bytes.}
        keyId: {type: string}
        signature: {type: string, contentEncoding: base64, description: "Ed25519 over \"cuelight-release-manifest-v1\\n\" + manifest."}
    SoftwareImportResult:
      type: object
      required: [version, created, artifacts]
      properties:
        version: {type: string}
        created: {type: boolean}
        artifacts:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: {type: string}
              state: {type: string, enum: [imported, present, missing, rejected]}
              error: {type: string}
        ignored: {type: array, items: {type: string}}
    NodeSoftwareStatus:
      type: object
      required: [nodeId, nodeName, status, outputStandby]
      properties:
        nodeId: {$ref: "#/components/schemas/Id"}
        nodeName: {type: string}
        running: {type: string}
        target: {type: string}
        targetRequestedAt: {type: string, format: date-time}
        latestAvailable: {type: string, description: Newest imported release this node can install (control's version for browser nodes).}
        status: {type: string, enum: [current, outdated, updating, failed, unknown, unsupported]}
        detail: {type: string}
        updateMethod: {type: string}
        channel: {type: string}
        outputStandby: {type: boolean}
        platform: {type: string}
        architecture: {type: string}
    SoftwareRolloutResult:
      type: object
      required: [version, updated, skipped]
      properties:
        version: {type: string}
        updated: {type: array, items: {$ref: "#/components/schemas/NodeSoftwareStatus"}}
        skipped:
          type: array
          items:
            type: object
            required: [nodeId, reason]
            properties:
              nodeId: {type: string}
              reason: {type: string}
    CurrentContent:
      type: object
      additionalProperties: false
      required: [releaseDigest, presentationKind, state, transitionedAt]
      properties:
        releaseDigest: {type: string, pattern: "^[a-f0-9]{64}$"}
        presentationKind: {type: string, enum: [media, media-schedule, web]}
        state: {type: string, enum: [playing, paused, off_air, stale]}
        itemId: {$ref: "#/components/schemas/Id"}
        mediaId: {$ref: "#/components/schemas/Id"}
        assetId: {$ref: "#/components/schemas/Id"}
        startedAt: {type: string, format: date-time}
        transitionedAt: {type: string, format: date-time}
        positionMs: {type: integer, format: int64, minimum: 0}
        width: {type: integer, format: int32, minimum: 1}
        height: {type: integer, format: int32, minimum: 1}
    NodeReport:
      type: object
      required: [eventEpoch, sequence, desiredGenerationSeen, observedGeneration, presentationKind, conditions]
      properties:
        eventEpoch: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        desiredGenerationSeen: {type: integer, format: int64, minimum: 0}
        observedGeneration: {type: integer, format: int64, minimum: 0}
        presentationKind: {type: [string, "null"], enum: [media, media-schedule, web, null]}
        renderingReleaseDigest: {type: [string, "null"], pattern: "^[a-f0-9]{64}$"}
        candidateReleaseDigest: {type: [string, "null"], pattern: "^[a-f0-9]{64}$"}
        healthyReleaseDigest: {type: [string, "null"], pattern: "^[a-f0-9]{64}$"}
        lastKnownGoodReleaseDigest: {type: [string, "null"], pattern: "^[a-f0-9]{64}$"}
        currentContent: {$ref: "#/components/schemas/CurrentContent"}
        reportedAt: {type: string, format: date-time}
        conditions: {type: array, items: {$ref: "#/components/schemas/Condition"}}
    Condition:
      type: object
      required: [type, status, reason]
      properties:
        type: {type: string}
        status: {type: boolean}
        reason: {type: string}
        message: {type: string}
    NodeEvent:
      type: object
      required: [id, epoch, sequence, type, occurredAt]
      properties:
        id: {type: string, format: uuid}
        epoch: {type: string, format: uuid}
        sequence: {type: integer, format: int64, minimum: 1}
        type: {type: string}
        occurredAt: {type: string, format: date-time}
        coversThrough: {type: integer, format: int64, minimum: 1}
        data: {type: object, additionalProperties: true}
