    get:
      tags: [player]
      operationId: pollPlayerRemoteEvents
      security: [{nodeMTLS: []}]
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: waitSeconds
          in: query
          schema: {type: integer, minimum: 0, maximum: 30, default: 0}
      responses:
        "200":
          description: Ordered remote events newer than the supplied sequence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RemoteEventPage"}
        default: {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: CableToken
    nodeMTLS:
      type: mutualTLS
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
    NodeId: {name: nodeId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    TokenId: {name: tokenId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    UploadId: {name: uploadId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    AssetId: {name: assetId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    ReleaseId: {name: releaseId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    CableDeploymentId: {name: deploymentId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    CableChannelId: {name: channelId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    CableProgramId: {name: programId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    CableShellBuildId: {name: shellBuildId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    CableRevisionId: {name: revisionId, in: path, required: true, schema: {$ref: "#/components/schemas/Id"}}
    PageCursor:
      name: cursor
      in: query
      description: Opaque, server-issued keyset cursor.
      schema: {type: string, maxLength: 2048}
    PageLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    PageSort:
      name: sort
      in: query
      schema: {type: string}
    PageOrder:
      name: order
      in: query
      schema: {type: string, enum: [asc, desc], default: asc}
    PageSearch:
      name: search
      in: query
      schema: {type: string, maxLength: 200}
    Digest:
      name: digest
      in: path
      required: true
      schema: {type: string, pattern: "^[a-f0-9]{64}$"}
  headers:
    ETag: {schema: {type: string}}
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Id: {type: string, format: uuid}
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        correlationId: {type: string}
    OperatorMe:
      type: object
      required: [id, scopes, capabilities]
      properties:
        id: {type: string}
        tokenId: {type: string}
        scopes: {type: array, items: {type: string}}
        capabilities: {type: object, additionalProperties: {type: boolean}}
    PageInfo:
      type: object
      required: [nextCursor, previousCursor, hasMore]
      properties:
        nextCursor: {type: [string, "null"]}
        previousCursor: {type: [string, "null"]}
        hasMore: {type: boolean}
    CableDeploymentInput:
      type: object
      additionalProperties: false
      required: [name, timezone, theme]
      properties:
        name: {type: string, minLength: 1}
        timezone: {type: string, minLength: 1}
        theme: {type: string, enum: [nebula, gallery, noir]}
        guideHorizonSeconds: {type: integer, format: int64, minimum: 3600, maximum: 2678400, default: 86400}
        guideDensity: {type: string, enum: [quarter-hour, half-hour, hour], default: half-hour}
        placardDefaults:
          type: object
          additionalProperties: {type: string}
        fallbackMetadata:
          type: object
          additionalProperties: {type: string}
    CableDeployment:
      type: object
      additionalProperties: false
      required: [id, name, timezone, theme, guideHorizonSeconds, guideDensity, version, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        timezone: {type: string}
        theme: {type: string, enum: [nebula, gallery, noir]}
        guideHorizonSeconds: {type: integer, format: int64, minimum: 3600, maximum: 2678400}
        guideDensity: {type: string, enum: [quarter-hour, half-hour, hour]}
        placardDefaults:
          type: object
          additionalProperties: {type: string}
        fallbackMetadata:
          type: object
          additionalProperties: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        createdBy: {$ref: "#/components/schemas/Id"}
        updatedBy: {$ref: "#/components/schemas/Id"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CableChannelInput:
      type: object
      additionalProperties: false
      required: [number, name]
      properties:
        number: {type: integer, minimum: 1}
        name: {type: string}
        callsign: {type: string}
        description: {type: string}
        accent: {type: string}
        artworkAssetId: {$ref: "#/components/schemas/Id"}
        enabled: {type: boolean}
        standby: {type: boolean}
    CableChannel:
      type: object
      additionalProperties: false
      required: [id, deploymentId, number, name, callsign, description, accent, enabled, standby, version, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        deploymentId: {$ref: "#/components/schemas/Id"}
        number: {type: integer, minimum: 1}
        name: {type: string}
        callsign: {type: string}
        description: {type: string}
        accent: {type: string}
        artworkAssetId: {$ref: "#/components/schemas/Id"}
        enabled: {type: boolean}
        standby: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CableProgramInput:
      type: object
      additionalProperties: false
      required: [assetId, startsAt, endsAt]
      properties:
        assetId: {$ref: "#/components/schemas/Id"}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        title: {type: string}
        subtitle: {type: string}
        tag: {type: string}
        artist: {type: string}
        description: {type: string}
        artworkAssetId: {$ref: "#/components/schemas/Id"}
        placardPolicy: {type: string}
        fit: {type: string}
        availabilityPolicy: {type: string}
        loop: {type: boolean}
        mute: {type: boolean}
        volume: {type: number, format: double, minimum: 0, maximum: 1}
    CableProgram:
      type: object
      additionalProperties: false
      required: [id, channelId, assetId, startsAt, endsAt, title, subtitle, tag, artist, description, placardPolicy, fit, availabilityPolicy, loop, mute, volume, version, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        channelId: {$ref: "#/components/schemas/Id"}
        assetId: {$ref: "#/components/schemas/Id"}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        title: {type: string}
        subtitle: {type: string}
        tag: {type: string}
        artist: {type: string}
        description: {type: string}
        artworkAssetId: {$ref: "#/components/schemas/Id"}
        placardPolicy: {type: string}
        fit: {type: string}
        availabilityPolicy: {type: string}
        loop: {type: boolean}
        mute: {type: boolean}
        volume: {type: number, format: double, minimum: 0, maximum: 1}
        version: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CablePlaylistItemInput:
      type: object
      additionalProperties: false
      required: [assetId, position, durationSeconds]
      properties:
        assetId: {$ref: "#/components/schemas/Id"}
        position: {type: integer, minimum: 1}
        durationSeconds: {type: integer, minimum: 1}
        title: {type: string}
        subtitle: {type: string}
    CablePlaylistInput:
      type: object
      additionalProperties: false
      required: [name, items]
      properties:
        name: {type: string, minLength: 1}
        description: {type: string}
        items:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/CablePlaylistItemInput"}
    CablePlaylistItem:
      type: object
      additionalProperties: false
      required: [id, playlistId, assetId, position, durationSeconds, title, subtitle]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        playlistId: {$ref: "#/components/schemas/Id"}
        assetId: {$ref: "#/components/schemas/Id"}
        position: {type: integer, minimum: 1}
        durationSeconds: {type: integer, minimum: 1}
        title: {type: string}
        subtitle: {type: string}
    CablePlaylist:
      type: object
      additionalProperties: false
      required: [id, name, description, items, version, createdBy, createdAt, updatedAt]
      properties:
        id: {$ref: "#/components/schemas/Id"}
        name: {type: string}
        description: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/CablePlaylistItem"}}
        version: {type: integer, format: int64, minimum: 1}
        createdBy: {$ref: "#/components/schemas/Id"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CableBlockInput:
      type: object
