name: release

# Builds every Cuelight artifact, signs cuelight-release.json, and publishes a
# GitHub release. See RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal VERSION on the selected ref; tag v<version> is created if missing)
        required: true
        type: string
      skip_mac:
        description: Skip the macOS desktop build (when Apple signing secrets are unavailable)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: tag matches VERSION
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=${INPUT_VERSION#v}
          fi
          node scripts/check-version.mjs --expect "v$version"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  go:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      - name: build-release.sh
        env:
          GORELEASER: goreleaser
        run: scripts/build-release.sh "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-go
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  # One job for both architectures so electron-builder writes a single
  # latest-mac.yml listing the arm64 and x64 zips.
  desktop-mac:
    needs: prepare
    if: ${{ !inputs.skip_mac }}
    runs-on: macos-15
    steps:
      - name: Apple signing secrets present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing Apple signing secrets:$missing (see RELEASING.md, or rerun with skip_mac=true)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: sidecars
        run: |
          node apps/node-desktop/scripts/build-sidecars.mjs --platform=darwin --arch=arm64
          node apps/node-desktop/scripts/build-sidecars.mjs --platform=darwin --arch=x64
      - run: pnpm --filter @cuelight/node-desktop build
      - name: electron-builder (signed + notarized)
        working-directory: apps/node-desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_CONTENT
          pnpm exec electron-builder --mac --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-mac
          path: |
            apps/node-desktop/release/*.zip
            apps/node-desktop/release/*.dmg
            apps/node-desktop/release/*.blockmap
            apps/node-desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/node-desktop/scripts/build-sidecars.mjs --platform=win32 --arch=x64
      - run: pnpm --filter @cuelight/node-desktop build
      - name: electron-builder
        working-directory: apps/node-desktop
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-windows
          path: |
            apps/node-desktop/release/*.exe
            apps/node-desktop/release/*.blockmap
            apps/node-desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 7

  # Native runner per architecture: x64 writes latest-linux.yml, arm64 writes
  # latest-linux-arm64.yml.
  desktop-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node apps/node-desktop/scripts/build-sidecars.mjs --platform=linux --arch=${{ matrix.arch }}
      - run: pnpm --filter @cuelight/node-desktop build
      - name: electron-builder
        working-directory: apps/node-desktop
        run: pnpm exec electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-linux-${{ matrix.arch }}
          path: |
            apps/node-desktop/release/*.AppImage
            apps/node-desktop/release/*.deb
            apps/node-desktop/release/latest-linux*.yml
          if-no-files-found: error
          retention-days: 7

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: assembleRelease (release-signed)
        working-directory: apps/node-android
        env:
          KEYSTORE_BASE64: ${{ secrets.CUELIGHT_ANDROID_KEYSTORE_BASE64 }}
          CUELIGHT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CUELIGHT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$CUELIGHT_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::CUELIGHT_ANDROID_KEYSTORE_BASE64 and CUELIGHT_ANDROID_KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          export CUELIGHT_ANDROID_KEYSTORE="$RUNNER_TEMP/android-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CUELIGHT_ANDROID_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$CUELIGHT_ANDROID_KEYSTORE"
          test -f "app/build/outputs/apk/release/Cuelight-${{ needs.prepare.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: apps/node-android/app/build/outputs/apk/release/Cuelight-${{ needs.prepare.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, go, desktop-mac, desktop-windows, desktop-linux, android]
    # desktop-mac may be skipped (skip_mac); every other job must succeed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: drop electron-builder by-products
        run: |
          rm -rf dist/builder-debug.yml dist/builder-effective-config.yaml dist/app-update.yml dist/*-unpacked
          ls -l dist
      - name: sign cuelight-release.json
        env:
          CUELIGHT_RELEASE_SIGNING_KEY: ${{ secrets.CUELIGHT_RELEASE_SIGNING_KEY }}
        run: go run ./cmd/cuelight-release manifest --version "$VERSION" --key-id cuelight-2026a --dir dist --out dist/cuelight-release.json
      - name: verify
        run: go run ./cmd/cuelight-release verify --manifest dist/cuelight-release.json --dir dist
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=
          [ "$PRERELEASE" = true ] && flags=--prerelease
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Cuelight $VERSION" --generate-notes $flags
