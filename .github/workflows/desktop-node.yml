name: desktop-node

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/node-desktop/**"
      - "cmd/cuelight-player/**"
      - "internal/player/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-node.yml"
  pull_request:
    paths:
      - "apps/node-desktop/**"
      - "cmd/cuelight-player/**"
      - "internal/player/**"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: pnpm/action-setup@v4
        with: {version: 10.14.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: go test ./cmd/cuelight-player ./internal/player/...
      - run: pnpm --filter @cuelight/node-desktop typecheck
      - run: pnpm --filter @cuelight/node-desktop test
      - run: pnpm --filter @cuelight/node-desktop sidecars
      - run: pnpm --filter @cuelight/node-desktop build
      - run: pnpm --filter @cuelight/node-desktop exec electron-builder --dir
      - uses: actions/upload-artifact@v4
        with:
          name: cuelight-node-${{ runner.os }}-${{ runner.arch }}
          path: apps/node-desktop/release/
