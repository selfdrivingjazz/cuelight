name: ci

# Linux only: macOS/Windows minutes are billed at a multiple on private repos.
# Desktop packaging for every OS runs in release.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cuelight
          POSTGRES_PASSWORD: cuelight
          POSTGRES_DB: cuelight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cuelight -d cuelight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CUELIGHT_POSTGRES_TEST_DSN: postgres://cuelight:cuelight@127.0.0.1:5432/cuelight_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: |
          umask 022
          go test ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: check versions
        run: node scripts/check-version.mjs
      - run: pnpm install --frozen-lockfile
      - name: api-client generated types match api/openapi.yaml
        run: |
          pnpm generate
          git diff --exit-code -- packages/api-client/src/generated.ts
      - run: pnpm -r typecheck
      - run: pnpm -r test
